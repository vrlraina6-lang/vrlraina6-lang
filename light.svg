864 /mnt/data/VRLRAINA_Profile_Banner_Corrected.svg
<svg width="1180" height="610" viewBox="0 0 1180 610"
     xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink">
  <title>VRLRAINA E — Animated Developer Profile Banner</title>
  <desc>Profile banner for an ECE undergraduate building AI, IoT, and full-stack projects.</desc>

  <defs>
    <!-- Gradients -->
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <linearGradient id="accent_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB">
        <animate attributeName="stop-color"
          values="#2563EB;#06B6D4;#10B981;#2563EB"
          dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#06B6D4">
        <animate attributeName="stop-color"
          values="#06B6D4;#10B981;#2563EB;#06B6D4"
          dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color"
          values="#10B981;#2563EB;#06B6D4;#10B981"
          dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="ascii_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB">
        <animate attributeName="stop-color"
          values="#2563EB;#06B6D4;#0EA5E9;#2563EB"
          dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#06B6D4">
        <animate attributeName="stop-color"
          values="#06B6D4;#0EA5E9;#2563EB;#06B6D4"
          dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="ring_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="ring_grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="panel_left_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#EFF3F8" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="panel_right_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#EFF3F8" stop-opacity="0.80"/>
    </linearGradient>

    <linearGradient id="shimmer_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.6)">
        <animate attributeName="offset" values="0%;50%;100%" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>

    <linearGradient id="text_extrude" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="rgba(37,99,235,0.2)" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow_blue" cx="30%" cy="35%" r="45%">
      <stop offset="0%" stop-color="rgba(37,99,235,0.10)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="glow_purple" cx="75%" cy="65%" r="45%">
      <stop offset="0%" stop-color="rgba(6,182,212,0.10)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="glow_emerald" cx="50%" cy="90%" r="40%">
      <stop offset="0%" stop-color="rgba(16,185,129,0.08)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <radialGradient id="spot_left" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="spot_right" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="blur_heavy" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <filter id="blur_med" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="glow_sm" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow_lg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="drop_shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="rgba(15,23,42,0.15)" flood-opacity="0.6"/>
    </filter>
    <filter id="inner_shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset dx="0" dy="2" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>

    <!-- Clip Paths -->
    <clipPath id="main_clip">
      <rect width="1180" height="610" rx="28"/>
    </clipPath>
    <clipPath id="left_clip">
      <rect width="420" height="570" rx="20"/>
    </clipPath>
    <clipPath id="right_clip">
      <rect width="720" height="570" rx="20"/>
    </clipPath>
    <clipPath id="ascii_clip">
      <rect x="0" y="0" width="400" height="0">
        <animate attributeName="height" from="0" to="450" dur="2s" fill="freeze"/>
      </rect>
    </clipPath>

    <!-- 3D Ring motion paths -->
    <path id="ring_path1" d="M 100,285 A 110,35 0 1,1 319,285 A 110,35 0 1,1 100,285"
          transform="rotate(-20 210 285)"/>
    <path id="ring_path2" d="M 120,285 A 90,28 0 1,1 299,285 A 90,28 0 1,1 120,285"
          transform="rotate(60 210 285)"/>
    <path id="ring_path3" d="M 140,285 A 70,22 0 1,1 279,285 A 70,22 0 1,1 140,285"
          transform="rotate(-70 210 285)"/>

    <!-- Noise texture pattern -->
    <filter id="noise_filter">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="overlay" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- ═══════════════════════════════════════════════════ -->
  <!--  BACKGROUND                                        -->
  <!-- ═══════════════════════════════════════════════════ -->
  <g clip-path="url(#main_clip)">
    <rect width="1180" height="610" fill="url(#bg_grad)"/>

    <!-- Ambient glow orbs -->
    <ellipse cx="300" cy="200" rx="350" ry="250" fill="url(#glow_blue)" filter="url(#blur_heavy)">
      <animate attributeName="cx" values="300;380;300" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="200;260;200" dur="10s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="900" cy="400" rx="320" ry="220" fill="url(#glow_purple)" filter="url(#blur_heavy)">
      <animate attributeName="cx" values="900;820;900" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="400;340;400" dur="13s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="600" cy="550" rx="280" ry="180" fill="url(#glow_emerald)" filter="url(#blur_heavy)">
      <animate attributeName="cx" values="600;680;600" dur="11s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Animated particles -->
    
        <circle cx="120" cy="80" r="2" fill="#06B6D4" filter="url(#glow_sm)">
            <animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.2s" begin="0s" repeatCount="indefinite"/>
            <animate attributeName="cy" values="80;65;80" dur="3.2s" begin="0s" repeatCount="indefinite"/>
        </circle>
        <circle cx="340" cy="180" r="1.5" fill="#2563EB" filter="url(#glow_sm)">
            <animate attributeName="opacity" values="0.1;0.9;0.1" dur="4.1s" begin="-1s" repeatCount="indefinite"/>
            <animate attributeName="cy" values="180;165;180" dur="4.1s" begin="-1s" repeatCount="indefinite"/>
        </circle>
        <circle cx="80" cy="400" r="2.5" fill="#10B981" filter="url(#glow_sm)">
            <animate attributeName="opacity" values="0.1;0.9;0.1" dur="5.0s" begin="-2s" repeatCount="indefinite"/>
            <animate attributeName="cy" values="400;385;400" dur="5.0s" begin="-2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="380" cy="480" r="1.8" fill="#06B6D4" filter="url(#glow_sm)">
            <animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.7s" begin="-0.5s" repeatCount="indefinite"/>
            <animate attributeName="cy" values="480;465;480" dur="3.7s" begin="-0.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="200" cy="540" r="1.2" fill="#2563EB" filter="url(#glow_sm)">
            <animate attributeName="opacity" values="0.1;0.9;0.1" dur="4.5s" begin="-1.5s" repeatCount="indefinite"/>
            <animate attributeName="cy" values="540;525;540" dur="4.5s" begin="-1.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="900" cy="100" r="2" fill="#10B981" filter="url(#glow_sm)">
            <animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.9s" begin="-0.8s" repeatCount="indefinite"/>
            <animate attributeName="cy" values="100;85;100" dur="3.9s" begin="-0.8s" repeatCount="indefinite"/>
        </circle>
        <circle cx="1100" cy="300" r="1.5" fill="#06B6D4" filter="url(#glow_sm)">
            <animate attributeName="opacity" values="0.1;0.9;0.1" dur="5.2s" begin="-2.5s" repeatCount="indefinite"/>
            <animate attributeName="cy" values="300;285;300" dur="5.2s" begin="-2.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="1050" cy="550" r="2" fill="#2563EB" filter="url(#glow_sm)">
            <animate attributeName="opacity" values="0.1;0.9;0.1" dur="4.0s" begin="-1.2s" repeatCount="indefinite"/>
            <animate attributeName="cy" values="550;535;550" dur="4.0s" begin="-1.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="750" cy="550" r="1.8" fill="#10B981" filter="url(#glow_sm)">
            <animate attributeName="opacity" values="0.1;0.9;0.1" dur="6.0s" begin="-3s" repeatCount="indefinite"/>
            <animate attributeName="cy" values="550;535;550" dur="6.0s" begin="-3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="650" cy="80" r="1.2" fill="#06B6D4" filter="url(#glow_sm)">
            <animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.5s" begin="-0.3s" repeatCount="indefinite"/>
            <animate attributeName="cy" values="80;65;80" dur="3.5s" begin="-0.3s" repeatCount="indefinite"/>
        </circle>

    <!-- ══════════════════════════════════════════════════ -->
    <!--  LEFT PANEL — 3D ASCII + Rings                   -->
